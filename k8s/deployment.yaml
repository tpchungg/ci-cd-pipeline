---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-python-deployment
  labels:
    app: my-python-app
  namepsace: my-python-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-python-app
  template:
    metadata:
      labels:
        app: my-python-app
    spec:
      containers:
        - name: my-python-container
          image: tpchungg/my_python_app:1df9d39ca9dd95af403e1b1f9faa15bbb24ecbab
          imagePullPolicy: Always
          ports:
          - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: my-python-service
  namespace: my-python-namespace
spec:
  type: ClusterIP
  selector:
    app: my-python-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080